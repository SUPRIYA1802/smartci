name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Detect changed source files
        id: changes
        run: |
          git diff --name-only HEAD~1 HEAD > changed_files.txt
          cat changed_files.txt

      - name: Identify affected tests
        id: impact
        run: |
          if grep -q '^src/pricing.py$' changed_files.txt; then
            echo "tests=tests/test_pricing.py tests/test_cart.py" >> $GITHUB_OUTPUT
          elif grep -q '^src/inventory.py$' changed_files.txt; then
            echo "tests=tests/test_inventory.py" >> $GITHUB_OUTPUT
          else
            echo "tests=" >> $GITHUB_OUTPUT
          fi

      - name: Run affected tests
        if: steps.impact.outputs.tests != ''
        run: pytest -v ${{ steps.impact.outputs.tests }}

      - name: Skip tests when no impact
        if: steps.impact.outputs.tests == ''
        run: echo "No affected tests. Skipping test execution."
        